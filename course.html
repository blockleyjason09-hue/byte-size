<script>
(function () {
  // Teacher or pupil: remembered on this device, chosen on the home page or with the switch in the header
  var KEY = 'bsc-role', role = null;
  try { role = localStorage.getItem(KEY); } catch (e) {}
  if (!role && document.body.getAttribute('data-role')) role = document.body.getAttribute('data-role');
  function apply() {
    document.querySelectorAll('[data-role-only]').forEach(function (el) { el.hidden = el.getAttribute('data-role-only') !== role; });
    var ask = document.getElementById('role-ask'); if (ask) ask.hidden = !!role;
    document.querySelectorAll('.role-switch [data-set-role]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-set-role') === role); });
  }
  document.querySelectorAll('[data-set-role]').forEach(function (b) {
    b.addEventListener('click', function () {
      var r = b.getAttribute('data-set-role'), changed = r !== role; role = r;
      try { localStorage.setItem(KEY, r); } catch (e) {}
      var tool = document.querySelector('#tool[data-fixed]');
      if (tool && changed) { location.href = 'course.html?m=' + (r === 'pupil' ? 'practise' : 'donow') + location.hash; return; }
      apply();
    });
  });
  apply();
  // Back button: previous page if it was on this site, otherwise the parent page
  var back = document.querySelector('.back');
  if (back) back.addEventListener('click', function () {
    var ref = document.referrer, same = false;
    try { same = ref && new URL(ref).origin === location.origin; } catch (e) {}
    if (same && history.length > 1) history.back(); else location.href = back.dataset.parent;
  });
  // Show / hide answers
  document.querySelectorAll('[data-answers]').forEach(function (b) {
    b.addEventListener('click', function () {
      var s = b.closest('.slide'); var on = s.classList.toggle('show');
      b.textContent = on ? 'Hide answers' : 'Show answers';
      b.setAttribute('aria-pressed', on);
    });
  });
  // Present full screen on the board
  function stop(s) {
    s.classList.remove('presenting'); document.body.classList.remove('is-presenting');
    var p = s.querySelector('.present'); if (p) p.textContent = 'Present';
    if (document.fullscreenElement) { document.exitFullscreen().catch(function () {}); }
  }
  document.querySelectorAll('.present').forEach(function (b) {
    b.addEventListener('click', function () {
      var s = b.closest('.slide');
      if (s.classList.contains('presenting')) { stop(s); return; }
      s.classList.add('presenting'); document.body.classList.add('is-presenting'); b.textContent = 'Close';
      if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen().catch(function () {}); }
    });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { var s = document.querySelector('.slide.presenting'); if (s) stop(s); }
  });
  document.addEventListener('fullscreenchange', function () {
    if (!document.fullscreenElement) { var s = document.querySelector('.slide.presenting'); if (s) stop(s); }
  });
  // Level filters
  document.querySelectorAll('.filters').forEach(function (f) {
    var grid = document.getElementById(f.dataset.for);
    f.querySelectorAll('.chip').forEach(function (c) {
      c.addEventListener('click', function () {
        f.querySelectorAll('.chip').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
        c.setAttribute('aria-pressed', 'true');
        var lvl = c.dataset.level;
        grid.querySelectorAll('.slide').forEach(function (s) { s.hidden = !(lvl === 'all' || s.dataset.level === lvl); });
      });
    });
  });
  // Multiple-choice practice
  document.querySelectorAll('.mcq').forEach(function (q) {
    q.querySelectorAll('.opt').forEach(function (o) {
      o.addEventListener('click', function () {
        q.querySelectorAll('.opt').forEach(function (x) { x.classList.remove('right', 'wrong'); });
        o.classList.add(o.dataset.correct ? 'right' : 'wrong');
      });
    });
  });
})();
</script>
